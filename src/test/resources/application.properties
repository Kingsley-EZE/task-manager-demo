# Tests use a throwaway in-memory database so they never touch ./data/taskdb
# and always start from empty, predictable tables.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# Keep the sample list out of tests so they start from an empty database.
taskmanager.seed-sample-data=false
