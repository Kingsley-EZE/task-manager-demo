spring.application.name=task-manager-demo

# --- Database ---------------------------------------------------------------
# H2 running in file mode: the whole database is the file ./data/taskdb.mv.db,
# so tasks survive an application restart. Swapping this block for a PostgreSQL
# url/driver is all it takes to move to a real server later.
spring.datasource.url=jdbc:h2:file:./data/taskdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# --- JPA / Hibernate --------------------------------------------------------
# ddl-auto=update lets Hibernate create and alter tables from the entity classes.
# Convenient while learning; a real deployment would use migrations (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- H2 web console at http://localhost:8080/h2-console ---------------------
# A browser window onto the real tables, which is useful while learning.
# It is unauthenticated, so it is bound to this machine only and must be turned
# off (spring.h2.console.enabled=false) before this is deployed anywhere.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
